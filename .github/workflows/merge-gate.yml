name: merge-gate
# Layer-2 CI merge gate (HG-DF C) — self-host. Re-derives, from the PR diff +
# committed .harness/attestations/<slug>.jsonl, whether every changed file went
# through a complete, ordered, scope-covering lifecycle. Fail-closed: a git /
# merge-base failure exits non-zero (never a vacuous pass). fetch-depth: 0 makes
# the base...head merge-base reachable.
on:
  pull_request: {}

jobs:
  attest-verify:
    needs: candidate-acceptance
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Require successful candidate acceptance
        shell: bash
        env:
          CANDIDATE_RESULT: ${{ needs.candidate-acceptance.result }}
        run: test "$CANDIDATE_RESULT" = success
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Checkout trusted baseline verifier source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .harness-trusted-base
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build isolated verifier from trusted BASE_SHA
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/keepsail-verifier"
          verifier="$RUNNER_TEMP/keepsail-verifier/bin"
          trusted_sha="$(git -C .harness-trusted-base rev-parse HEAD)"
          test "$trusted_sha" = "$BASE_SHA"
          "$verifier/python" -m pip install --disable-pip-version-check \
            "$GITHUB_WORKSPACE/.harness-trusted-base[dev]"
          env -u PYTHONPATH TRUSTED_ROOT="$GITHUB_WORKSPACE/.harness-trusted-base" \
            BASE_SHA="$BASE_SHA" "$verifier/python" -I -c \
            'import hashlib, importlib, os, pathlib, subprocess, tomllib; trusted = pathlib.Path(os.environ["TRUSTED_ROOT"]); project = tomllib.loads((trusted / "pyproject.toml").read_text())["project"]; namespace = project["scripts"][project["name"]].split(".", 1)[0]; attest = importlib.import_module(namespace + ".cli.attest"); events = importlib.import_module(namespace + ".core.events"); verifier = pathlib.Path(attest.__file__).resolve(); installed = pathlib.Path(events.__file__).resolve(); expected = trusted / "src" / namespace / "core" / "events.py"; assert subprocess.check_output(["git", "-C", str(trusted), "rev-parse", "HEAD"], text=True).strip() == os.environ["BASE_SHA"]; assert "site-packages" in str(verifier); assert "site-packages" in str(installed); assert ".harness-trusted-base" not in str(verifier); assert ".harness-trusted-base" not in str(installed); assert hashlib.sha256(installed.read_bytes()).hexdigest() == hashlib.sha256(expected.read_bytes()).hexdigest(); print("A17 verifier loaded from {} and matches trusted BASE_SHA={}".format(verifier, os.environ["BASE_SHA"]))'
      - name: Prepare trusted BASE workspace with exact target evidence
        shell: bash
        run: |
          git -C .harness-trusted-base fetch --no-tags "$GITHUB_WORKSPACE" "$HEAD_SHA"
          python - <<'PY'
          import os
          import pathlib
          import subprocess

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / ".harness-trusted-base"
          def git(*args):
              return subprocess.check_output(["git", "-C", str(root), *args])
          assert git("rev-parse", "HEAD").decode().strip() == os.environ["BASE_SHA"]
          target = git("rev-parse", "--verify", os.environ["HEAD_SHA"] + "^{commit}").decode().strip()
          assert target == os.environ["HEAD_SHA"]
          entries = git("ls-tree", "-rz", target, "--", ".harness/attestations").split(b"\0")
          for entry in filter(None, entries):
              metadata, raw_path = entry.split(b"\t", 1)
              mode, kind, oid = metadata.split()
              path = pathlib.PurePosixPath(raw_path.decode("utf-8"))
              assert mode in (b"100644", b"100755") and kind == b"blob", "nonregular attestation"
              assert path.parts[:2] == (".harness", "attestations") and len(path.parts) == 3
              assert path.suffix == ".jsonl" and ".." not in path.parts
              destination = root.joinpath(*path.parts)
              assert destination.resolve().is_relative_to(root.resolve())
              content = git("cat-file", "blob", oid.decode())
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(content)
              assert destination.read_bytes() == content
          print("Trusted BASE workspace; only target attestation blobs projected, source/config unchanged")
          PY
      - name: Verify lifecycle attestations cover the diff
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/.harness-trusted-base"
          # The trusted base may predate Keepsail; select only its installed CLI.
          verifier="$RUNNER_TEMP/keepsail-verifier/bin"
          base_cli="$(env -u PYTHONPATH "$verifier/python" -I -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["name"])')"
          cli="$verifier/$base_cli"
          env -u PYTHONPATH "$cli" \
            attest verify --base "$BASE_SHA" --head "$HEAD_SHA"

  candidate-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install candidate package for candidate tests only
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Run new-contract acceptance tests
        run: python -m pytest -q tests/unit/core/test_approval.py tests/integration/lifecycle/test_plan_authority.py tests/integration/lifecycle/test_knowledge_policy_bootstrap.py tests/integration/lifecycle/test_keepsail_pilot_configuration.py tests/integration/lifecycle/test_trusted_verifier_workspace.py
