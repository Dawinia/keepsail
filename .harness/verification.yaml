layers:
  baseline: { enabled: true }
  framework_adapter: { enabled: true }
  user_checks: { enabled: true }
defaults:
  timeout_seconds: 300
  must_pass: true
  capture: both
  workdir: .
  env: { CI: "1" }
execution:
  mode: parallel
  max_parallelism: 4
  fail_fast: false
# HG-D self-host (2026-06-02): the launcher selects the repository's native
# `.venv/Scripts` or `.venv/bin` toolchain. The command is direct argv, so a
# Windows cmd assignment cannot be mistaken for a successful check.
checks:
- id: ruff
  command: [python, -m, scripts.run_project_check, ruff, check, src, tests, scripts]
  must_pass: true
- id: mypy
  command: [python, -m, scripts.run_project_check, mypy, src]
  must_pass: true
- id: pytest
  command: [python, -m, scripts.run_project_check, pytest, -q]
  must_pass: true
  # Local self-host: the non-e2e suite takes ~22 minutes on this machine
  # (the suite is dominated by lifecycle/integration fixtures, not by a
  # hang), so the 20-minute default truncated a passing run at 90%+.
  timeout_seconds: 2700
adapter_provided: []
