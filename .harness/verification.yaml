layers:
  baseline: { enabled: true }
  framework_adapter: { enabled: true }
  user_checks: { enabled: true }
defaults:
  timeout_seconds: 300
  must_pass: true
  capture: both
  workdir: .
  env: { CI: "1" }
execution:
  mode: parallel
  max_parallelism: 4
  fail_fast: false
# HG-D self-host (2026-06-02): the launcher selects the repository's native
# `.venv/Scripts` or `.venv/bin` toolchain. The command is direct argv, so a
# Windows cmd assignment cannot be mistaken for a successful check.
checks:
- id: ruff
  command: [python, -m, scripts.run_project_check, ruff, check, src, tests, scripts]
  must_pass: true
- id: mypy
  command: [python, -m, scripts.run_project_check, mypy, src]
  must_pass: true
- id: pytest
  command: [python, -m, scripts.run_project_check, pytest, -q, -n, "2"]
  must_pass: true
  # Local self-host (change 2026-11-24-verify-timeout): the serial suite now
  # often exceeds 2700s on Windows because of product git-subprocess cost, so
  # it runs on two pytest-xdist workers (two, not more: this host is memory
  # constrained). 3300s stays below the one-shot dispatcher ceiling
  # ONESHOT_DISPATCHER_TIMEOUT_S = 3600 so this check timeout stays
  # authoritative. Exit: the follow-up Windows git performance Change measures
  # the serial suite; below 2000s it restores the serial command and 2700s.
  # Backstop: the owner re-evaluates this relaxation by 2026-12-31.
  timeout_seconds: 3300
adapter_provided: []
